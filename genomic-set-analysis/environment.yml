name: genomicSetAnalysis
# Installed by scripts/ensure_env.sh into:
#   ~/.cache/ai-skills-env/genomic-set-analysis/conda-env/
# Force rebuild: bash scripts/ensure_env.sh --force-rebuild
#
# Bioconda channel order + strict priority keeps the solver fast and low-memory.
# Do not add ``defaults`` — it duplicates conda-forge and inflates repodata fetches.
channels:
  - bioconda
  - conda-forge
channel_priority: strict
dependencies:
  # Intervene 0.6.4 imports `from collections import Iterable`, removed in Python 3.10+,
  # so the interpreter must stay < 3.10. Do not bump without a newer Intervene release.
  - python=3.9
  - intervene>=0.6.4
  - bedtools>=2.30
  - pybedtools>=0.9.0
  - pandas>=1.3
  - numpy>=1.21
  # Expression summaries (expression_summary.py)
  - scipy>=1.7
  - seaborn>=0.12
  - matplotlib>=3.5
  # Chained pathway enrichment (pathway-enrichment-enrichr skill; SKILL.md Step 3).
  # xlsxwriter is required by enrichr_api.py / enrichment_postprocess.py Excel export;
  # requests is required for Enrichr HTTPS API calls.
  - xlsxwriter>=3.0
  - requests>=2.28
  - rich>=13.0
  # Testing
  - pytest>=7.0
