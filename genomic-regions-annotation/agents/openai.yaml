interface:
  display_name: "Genomic regions annotation"
  short_description: "Annotate genomic regions to genes, features, and chromatin states (ChromHMM/Segway) with an explicit genome build."
  default_prompt: "Use $genomic-regions-annotation with an explicitly stated genome (ask if missing). For chromatin demos, prefer example_input/chromatin/CTCF and POLR2A BEDs, and do not run OrganizeAnnotationResults after chromatin annotation."

policy:
  allow_implicit_invocation: true
  safety: "Follow Microsoft content policies"
  copyright: "Avoid generating copyrighted text verbatim"
  code_changes:
    - "Prefer small, focused edits"
    - "Do not revert unrelated user changes"
    - "Validate changes before finishing"
